# Smithery configuration file: https://smithery.ai/docs/build/project-config

startCommand:
  type: stdio
  commandFunction:
    # A JS function that produces the CLI command based on the given config to start the MCP on stdio.
    |-
    (config) => ({ command: 'node', args: ['local-server.js'], env: { SUPERMEMORY_API_KEY: config.supermemoryApiKey } })
  configSchema:
    # JSON Schema defining the configuration options for the MCP.
    type: object
    required:
      - supermemoryApiKey
    properties:
      supermemoryApiKey:
        type: string
        description: API key for Supermemory authentication
  exampleConfig:
    supermemoryApiKey: your-supermemory-api-key-here
